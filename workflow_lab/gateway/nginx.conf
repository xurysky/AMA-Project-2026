user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml application/json;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /ama-workflow { return 301 /ama-workflow/; }
    location /ama-workflow/ {
      proxy_pass https://fn-ama-workflow-lab-1103.azurewebsites.net/api/lab/;
      proxy_ssl_server_name on;
      proxy_ssl_name fn-ama-workflow-lab-1103.azurewebsites.net;
      proxy_set_header Host fn-ama-workflow-lab-1103.azurewebsites.net;
      proxy_set_header X-Functions-Key "${AMA_WORKFLOW_FUNCTION_KEY}";
      proxy_set_header X-MS-CLIENT-PRINCIPAL-ID $http_x_ms_client_principal_id;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Prefix /ama-workflow;
      proxy_connect_timeout 20s;
      proxy_read_timeout 120s;
      proxy_buffering off;
      add_header Cache-Control "no-store" always;
    }

    location = /aks { return 301 /aks/; }
    location /aks/ {
      proxy_pass http://4.189.227.226/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Prefix /aks;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Showcase-Gateway-Key "${SHOWCASE_GATEWAY_KEY}";
      proxy_connect_timeout 10s;
      proxy_read_timeout 240s;
      proxy_send_timeout 240s;
      proxy_buffering off;
    }

    location /assets/ {
      try_files $uri =404;
      expires 1h;
      add_header X-Content-Type-Options nosniff always;
    }

    location / {
      add_header Cache-Control "no-store, max-age=0" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      try_files $uri $uri/ /index.html;
    }
  }
}

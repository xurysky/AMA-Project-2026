async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...options});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.detail||`HTTP ${r.status}`);return data}

function renderDiscountSensitivity(c){const points=decisionIntelligence[c?.case_id]?.discount_sensitivity||[];if(!points.length)return '';return `<div class="task-section-head" style="margin:14px 0 8px"><div><h2 style="font-size:12px">${lang==='zh'?'折扣敏感度：销量提升不等于利润最优':'Discount sensitivity: more units do not always mean more profit'}</h2><p>${lang==='zh'?'AI 对 0% / 10% / 15% / 20% / 30% 五档进行相似历史样本推演':'AI simulated five discount bands against comparable historical patterns'}</p></div></div><div class="discount-scale">${points.map(p=>`<div class="discount-point ${p.decision==='RECOMMENDED'?'recommended':p.decision==='POLICY_BLOCKED'?'blocked':''}"><strong>${p.discount_pct}%</strong><span>${lang==='zh'?'预测':'Forecast'} ${fmt(p.predicted_units)} ${lang==='zh'?'件':'units'}</span><span>ROI ${fmt(p.profit_roi,2)}×</span><span>${p.decision==='RECOMMENDED'?(lang==='zh'?'AI 推荐':'Recommended'):p.decision==='POLICY_BLOCKED'?(lang==='zh'?'策略阻止':'Policy blocked'):(lang==='zh'?'已比较':'Compared')}</span></div>`).join('')}</div>`}

function processRail(){const current=workflowStage(),steps=lang==='zh'?[['发现','AI 发现经营异常'],['核验','人机核对可信事实'],['决策','人工批准决策包'],['执行','系统写入并返回回执'],['复盘','审计结果与业务指标']]:[['Detect','AI finds an exception'],['Validate','Human + AI verify facts'],['Decide','Human approves packet'],['Execute','Systems return receipts'],['Learn','Audit results and KPI']];return `<section class="process-rail" aria-label="decision workflow">${steps.map((s,i)=>`<div class="process-step ${i+1===current?'active':''}" data-step="${i+1}"><strong>${s[0]}</strong><span>${s[1]}</span></div>`).join('')}</section>`}

function renderPanelStory(active,complete,confidence){const human=cases.filter(c=>['WAITING_FOR_APPROVAL','WAITING_FOR_STORE_CONFIRMATION','PARTIALLY_EXECUTED'].includes(c.status)).length,blocked=cases.reduce((n,c)=>n+c.actions.filter(a=>a.status==='BLOCKED').length,0),receipts=cases.reduce((n,c)=>n+c.execution_receipts.length,0),agents=platform?.core_agents?Object.keys(platform.core_agents).length:5;const stage=active?stageIndex(active):5;const storySteps=lang==='zh'?[['业务异常','天气、POS、RFID、OMS 和门店信号形成一个 Retail Decision Case。'],['可信事实','ATP、毛利、客户授权和库存可信度由确定性服务计算。'],['Agent 协同','五个 Agent 只在相关领域参与，跳过或阻断会被留痕。'],['人工决策','店长、区域经理和经营管理层审批同一个 Decision Packet。'],['受控执行','审批后才写 ERP/WMS/CRM/门店任务，并记录回执与补偿。']]:[['Exception','Weather, POS, RFID, OMS and store signals form one Retail Decision Case.'],['Truth','ATP, margin, consent and confidence are calculated by deterministic services.'],['Agents','Five Agents participate only where relevant; skips and blocks are traceable.'],['Decision','Store, regional and executive roles approve one Decision Packet.'],['Execution','Approved writes go to ERP/WMS/CRM/store tasks with receipts and compensation.']];return `<section class="panel-story"><div class="story-hero"><div class="eyebrow">${lang==='zh'?'AMA 二次过堂演示故事':'AMA PANEL STORY MODE'}</div><h2>${lang==='zh'?'题目能力不变：客户数据、全渠道个性化、五 Agent；表达方式升级为可审计经营闭环':'Same prompt, stronger proof: customer data, omni-channel personalization, five Agents, and auditable execution'}</h2><p>${lang==='zh'?'这次演示的融合主线是：Customer Understanding 和 Personalization 仍然是核心，但个性化不能脱离库存、价格、授权和门店履约。所以系统把线上、移动端、实体门店和会员信号收敛成一个 Retail Decision Case，再由五个 Agent 协同生成可审批、可执行、可复盘的动作。':'The blended story is: Customer Understanding and Personalization remain core, but personalization cannot be separated from inventory, pricing, consent and store fulfillment. The system turns online, mobile, store and membership signals into one Retail Decision Case, then five Agents create approvable, executable and measurable actions.'}</p><div class="story-actions">${active?`<button class="primary" onclick="openCase('${active.case_id}')">${icon('play-circle')}${lang==='zh'?'开始 8 分钟系统演示':'Start 8-minute system demo'}</button>`:''}<button onclick="startTour()">${icon('route')}${lang==='zh'?'答辩故事线':'Panel storyline'}</button><button onclick="setView('agents')">${icon('network')}${lang==='zh'?'展示五 Agent 覆盖':'Five-Agent proof'}</button><button onclick="setView('audit')">${icon('history')}${lang==='zh'?'展示审计证据':'Audit proof'}</button></div><div class="story-points"><div class="story-point"><span>${lang==='zh'?'贴题主线':'Prompt fit'}</span><strong>${lang==='zh'?'客户数据整合 + 全渠道个性化':'Customer data + omni-channel personalization'}</strong></div><div class="story-point"><span>${lang==='zh'?'可信升级':'Credibility upgrade'}</span><strong>${lang==='zh'?'个性化动作进入审批、执行和审计':'Personalized actions enter approval, execution and audit'}</strong></div><div class="story-point"><span>${lang==='zh'?'证据边界':'Evidence boundary'}</span><strong>${lang==='zh'?'成功标准是试点目标，不是 Demo 已实现结果':'Success criteria are pilot targets, not demo results'}</strong></div></div></div><aside class="story-proof"><h3>${lang==='zh'?'明天要主动展示的证据':'Proof to show proactively'}</h3><div class="proof-row"><span>${icon('database',16)}</span><div><b>${lang==='zh'?'客户与经营信号':'Customer + retail signals'}</b><small>${lang==='zh'?'线上、移动端、门店、会员和库存进入同一 Case':'Online, mobile, store, member and inventory data enter one Case'}</small></div><strong>${cases.length}</strong></div><div class="proof-row"><span>${icon('network',16)}</span><div><b>${lang==='zh'?'五 Agent 能力域':'Five Agent domains'}</b><small>${lang==='zh'?'客户洞察、个性化、库存、定价、营销':'Customer, personalization, inventory, pricing and marketing'}</small></div><strong>${agents}</strong></div><div class="proof-row"><span>${icon('shield-check',16)}</span><div><b>${lang==='zh'?'人工审批护栏':'Human approval guardrails'}</b><small>${lang==='zh'?'高风险个性化、价格和营销动作审批后执行':'Risky personalization, pricing and marketing execute after approval'}</small></div function roleTabs(){if(userRole==='store')return lang==='zh'?[['overview','任务说明'],['evidence','库存依据'],['execution','处理记录']]:[['overview','Task'],['evidence','Stock facts'],['execution','Activity']];if(userRole==='regional')return lang==='zh'?[['intelligence','AI 决策助手'],['overview','决策摘要'],['evidence','业务依据'],['execution','执行计划'],['agents','审计详情']]:[['intelligence','AI decision support'],['overview','Decision'],['evidence','Business facts'],['execution','Execution plan'],['agents','Audit detail']];return lang==='zh'?[['intelligence','AI 经营推演'],['overview','经营方案'],['evidence','业务依据'],['execution','落地计划'],['agents','审计详情']]:[['intelligence','AI business simulation'],['overview','Business plan'],['evidence','Business facts'],['execution','Rollout plan'],['agents','Audit detail']]}
function renderCaseWorkspace(c){if(!c)return '';const i=stageIndex(c),tabs=roleTabs();return `<section class="panel case-detail"><div class="case-header"><img class="product-image" src="${productImage(c)}" alt="${esc(productName(c.variant))}"><div><div class="header-badges">${badge(c.severity,c.severity)}${badge(c.status)}${userRole==='executive'?`<span class="data-boundary">${lang==='zh'?'真实生产 Case · 中国':'Production case · China'}</span>`:''}</div><h3>${esc(caseTitle(c))}</h3><div class="case-id">${esc(storeName(c))} · ${esc(productName(c.variant))}<span class="optional"> · ${c.case_id}</span></div></div><div class="case-owner"><span>${lang==='zh'?'当前负责人':'Current owner'}</span><strong>${esc(roleName(c.owner_role))}</strong><span>${t('sla')}</span><strong>${timeLeft(c.sla_due_at)}</strong></div></div><div class="case-stage">${(lang==='zh'?['发现异常','核验事实','业务决策','执行落地','结果复盘']:['Detect','Validate','Decide','Execute','Learn']).map((x,n)=>`<div class="case-stage-item ${n+1<i?'done':n+1===i?'current':''}">${x}</div>`).join('')}</div><div class="case-tabs">${tabs.map(x=>`<button class="${detailTab===x[0]?'active':''}" onclick="setDetailTab('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="case-workspace"><div class="case-content">${renderRoleCaseTab(c)}</div>${renderRoleActionPanel(c)}</div></section>`}
function renderCaseTab(c){const inv=c.inventory,p=c.decision_packet;if(detailTab==='evidence')return `<div class="decision-callout"><h4>${lang==='zh'?'库存口径先统一':'Start with one inventory definition'}</h4><p>${lang==='zh'?'可售 ATP = 账面现货 − 软预留 − 安全库存 − 冻结隔离 − 待调出 + 合格在途。Agent 与人工审批读取同一个时间点快照。':'Sellable ATP = physical − reserved − safety − blocked − transfer-out + eligible inbound. Agents and approvers read the same point-in-time snapshot.'}</p></div><div class="metric-cards"><div class="metric-card"><span>${t('physical')}</span><strong>${fmt(inv.physical_on_hand)}</strong></div><div class="metric-card"><span>${t('reserved')} + ${t('safety')}</span><strong>-${fmt(inv.soft_reserved+inv.safety_stock)}</strong></div><div class="metric-card"><span>${t('blocked')}</span><strong>-${fmt(inv.blocked_or_quarantined)}</strong></div><div class="metric-card"><span>${t('atp')}</span><strong style="color:var(--green)">${fmt(inv.sellable_atp)}</strong></div></div><div class="section-head"><h4>${lang==='zh'?'参与本次决策的证据':'Evidence used in this decision'}</h4><span>${c.evidence.length} ${lang==='zh'?'个来源':'sources'} · ${time(c.as_of_time)}</span></div><div class="evidence-list">${c.evidence.map(e=>`<div class="evidence-row"><span class="quality-dot ${esc(e.quality)}"></span><div><div class="row-title">${esc(e.source)}</div><p>${esc(localText(e.summary))}</p></div><span class="badge ${e.quality==='verified'?'verified':'high'}">${esc(status(e.quality))}</span></div>`).join('')}</div><div class="attention">${lang==='zh'?`库存可信度 ${Math.round(inv.inventory_confidence*100)}%，主数据版本 ${esc(c.variant.master_data_version)}，快照后任何变化都需要重新评估。`:`Inventory confidence ${Math.round(inv.inventory_confidence*100)}%, master data ${esc(c.variant.master_data_version)}. Changes after the snapshot require reassessment.`}</div>`;if(detailTab==='agents')return `<div class="decision-callout"><h4>${lang==='zh'?'AI 提供判断，人类承担业务责任':'AI advises; humans own the business decision'}</h4><p>${lang==='zh'?'Orchestrator 只调用与本 Case 有关的 Agent；Policy Engine 可阻断动作。页面呈现参与、跳过和阻断，而不是制造“五个 Agent 都必须说话”的假象。':'The Orchestrator invokes only relevant Agents; the Policy Engine can block actions. Participation, skip and block are explicit.'}</p></div><div class="agent-list">${c.agent_decisions.map((d,n)=>`<div class="agent-row"><span class="agent-role">${n+1}</span><div><div class="row-title">${esc(localText(d.agent))} <span class="badge ${d.role==='lead'?'critical':d.role==='support'||d.role==='required'?'support':'neutral'}">${esc(localText(d.role))}</span></div><p>${esc(localText(d.recommendation))}</p>${d.blockers.length?`<div class="blocked-note">${textList(d.blockers).map(esc).join(' · ')}</div>`:''}</div><div class="right">${badge(d.status)}<div class="confidence">${Math.round(d.confidence*100)}%</div></div></div>`).join('')}</div>`;if(detailTab==='execution')return `<div class="section-head"><h4>${lang==='zh'?'受控执行动作':'Controlled execution actions'}</h4><span>${c.actions.length} ${lang==='zh'?'个动作':'actions'}</span></div><div class="action-list">${c.actions.map(a=>renderAction(c,a)).join('')}</div><div class="section-head" style="margin-top:22px"><h4>${lang==='zh'?'系统回执与补偿':'System receipts & compensation'}</h4><span>${c.execution_receipts.length} ${lang==='zh'?'条回执':'receipts'}</span></div><div class="receipt-list">${c.execution_receipts.length?c.execution_receipts.map(r=>`<div class="receipt-row"><span>${r.status==='COMPLETED'?icon('check-circle',17):icon('alert-circle',17)}</span><div><div class="row-title">${esc(r.action_id)} · ${esc(localText(r.target_system))}</div><p>${esc(localText(r.detail))}${r.compensation_action?` · ${esc(localText(r.compensation_action))}`:''}</p><span class="sub">${time(r.completed_at)} · ${t('attempt')} ${r.attempt}</span></div>${badge(r.status)}</div>`).join(''):`<div class="empty">${lang==='zh'?'尚未产生执行回执':'No execution receipts yet'}</div>`}</div>`;return `<div class="decision-callout"><h4>${lang==='zh'?'AI 建议':'AI recommendation'}</h4><p>${esc(localText(p.recommendation))}</p></div><div class="metric-cards"><div class="metric-card"><span>${t('atp')}</span><strong>${fmt(inv.sellable_atp)}</strong></div><div class="metric-card"><span>${t('daysSupply')}</span><strong>${fmt(inv.days_of_supply,1)}</strong></div><div class="metric-card"><span>${t('confidence')}</span><strong>${Math.round(inv.inventory_confidence*100)}%</strong></div><div class="metric-card"><span>${lang==='zh'?'决策包版本':'Packet version'}</span><strong>v${p.version}</strong></div></div><div class="section-head"><h4>${lang==='zh'?'为什么这样建议':'Why this recommendation'}</h4><span>${esc(p.policy_version)}</span></div><div class="reason-list">${textList(p.rationale).map((x,n)=>`<div class="reason-item"><b>${n+1}</b><span>${esc(x)}</span></div>`).join('')}</div>${p.blockers.length?`<div class="blocked-note" style="margin-top:14px"><strong>${t('blockers')}：</strong> ${textList(p.blockers).map(esc).join(' · ')}</div>`:''}<div class="attention" style="margin-top:14px">${lang==='zh'?'可展开“事实与证据”和“AI 协同”查看依据；真正写入 ERP / WMS / OMS / CRM 前仍需通过角色审批、ATP、利润和同意策略护栏。':'Open Facts or AI Collaboration for detail. ERP/WMS/OMS/CRM writes still require role approval and ATP, margin and consent guardrails.'}</div>`}
function renderRoleCaseTab(c){if(detailTab==='intelligence')return renderDecisionIntelligence(c);if(detailTab!=='overview')return renderCaseTab(c);const inv=c.inventory;if(userRole==='store')return `<div class="decision-callout"><h4>${storeTaskTitle(c)}</h4><p>${lang==='zh'?'请核对货架、仓库和待退货区的实物数量，然后在右侧提交结果。':'Check the sales floor, stockroom, and returns area, then submit the physical count.'}</p></div><div class="metric-cards"><div class="metric-card"><span>${lang==='zh'?'系统账面库存':'System stock'}</span><strong>${fmt(inv.physical_on_hand)}</strong></div><div class="metric-card"><span>${lang==='zh'?'当前可售':'Sellable now'}</span><strong>${fmt(inv.sellable_atp)}</strong></div><div class="metric-card"><span>${lang==='zh'?'库存可信度':'Stock confidence'}</span><strong>${Math.round(inv.inventory_confidence*100)}%</strong></div><div class="metric-card"><span>${lang==='zh'?'完成时限':'Due'}</span><strong style="font-size:13px">${timeLeft(c.sla_due_at)}</strong></div></div><div class="section-head"><h4>${lang==='zh'?'盘点范围':'Count scope'}</h4></div><div class="reason-list"><div class="reason-item"><b>1</b><span>${lang==='zh'?'先数卖场陈列和试衣间商品。':'Count the sales floor and fitting rooms.'}</span></div><div class="reason-item"><b>2</b><span>${lang==='zh'?'再数仓库、待退货和隔离商品。':'Then count stockroom, returns, and quarantine.'}</span></div><div class="reason-item"><b>3</b><span>${lang==='zh'?'只填写实物总数，不需要计算可售库存。':'Enter the physical total; sellable stock is calculated automatically.'}</span></div></div>`;if(userRole==='regional')return `<div class="decision-callout"><h4>${regionalQuestion(c)}</h4><p>${businessRecommendation(c)}</p></div><div class="metric-cards"><div class="metric-card"><span>${t('atp')}</span><strong>${fmt(inv.sellable_atp)}</strong></div><div class="metric-card"><span>${t('daysSupply')}</span><strong>${fmt(inv.days_of_supply,1)}</strong></div><div class="metric-card"><span>${t('confidence')}</span><strong>${Math.round(inv.inventory_confidence*100)}%</strong></div><div class="metric-card"><span>${lang==='zh'?'完成时限':'Due'}</span><strong style="font-size:13px">${timeLeft(c.sla_due_at)}</strong></div></div><div class="section-head"><h4>${lang==='zh'?'批准后会发生什么':'What happens after approval'}</h4></div><div class="action-summary">${businessActionSummary(c)}</div>`;return `<div class="decision-callout"><h4>${regionalQuestion(c)}</h4><p>${businessRecommendation(c)}</p></div><div class="metric-cards"><div class="metric-card"><span>${lang==='zh'?'生产市场':'Production market'}</span><strong style="font-size:14px">${lang==='zh'?'中国':'China'}</strong></div><div class="metric-card"><span>${lang==='zh'?'当前可售':'Sellable ATP'}</span><strong>${fmt(inv.sellable_atp)}</strong></div><div class="metric-card"><span>${lang==='zh'?'会员促销':'Member offer'}</span><strong>15%</strong></div><div class="metric-card"><span>${lang==='zh'?'全渠道降价':'Broad markdown'}</span><strong style="color:var(--brand);font-size:14px">${lang==='zh'?'30% 已阻止':'30% blocked'}</strong></div></div><div class="section-head"><h4>${lang==='zh'?'经营判断':'Business assessment'}</h4></div><div class="reason-list"><div class="reason-item"><b>1</b><span>${lang==='zh'?'先通过门店调拨消化库存，避免立即扩大折扣。':'Rebalance stock before expanding discount depth.'}</span></div><div class="reason-item"><b>2</b><span>${lang==='zh'?'15% 会员券仅准备草稿，审批后仍受库存和同意规则约束。':'The 15% member offer remains a draft and is constrained by stock and consent rules.'}</span></div><div class="reason-item"><b>3</b><span>${lang==='zh'?'30% 全渠道降价触及毛利底线，当前不会执行。':'A 30% broad markdown breaches the margin floor and will not execute.'}</span></div></div>`}
function aiScenarioName(s){const zh={no_action:'不采取行动',transfer_only:'仅调拨库存',transfer_member_15:'调拨 + 15% 会员券',broad_markdown_30:'30% 全渠道降价',restore_supply:'调拨 + 补货',verify_inventory:'先完成实物盘点'};return lang==='zh'?(zh[s.key]||s.name):s.name}
function aiScenarioReason(s){const zh={no_action:'库存老化和后仓压力不会得到解决。',transfer_only:'缓解门店容量，但不会提升需求。',transfer_member_15:'在销量、增量利润、会员授权和可供库存之间最平衡。',broad_markdown_30:'全渠道深度降价被当前毛利政策阻止。',restore_supply:'先恢复可售库存，避免促销进一步放大缺货。',verify_inventory:'库存差异未消除前，不做调拨、补货或促销判断。'};return lang==='zh'?(zh[s.key]||s.reason):s.reason}
function aiScenarioStatus(s){const zh={RECOMMENDED:'AI 推荐',SAFE_ALTERNATIVE:'安全备选',NOT_RECOMMENDED:'不建议',POLICY_BLOCKED:'策略阻止',HIGH_STOCKOUT_RISK:'高缺货风险'};return lang==='zh'?(zh[s.status]||status(s.status)):status(s.status)}
function aiChannelName(name){const zh={'Store POS':'门店 POS','WeChat member offer':'微信会员券','Outlet store network':'奥莱门店网络','Tmall / JD broad campaign':'天猫 / 京东全量活动','Store sellable stock':'门店当前可售','Store cycle count':'门店实物盘点','Inter-store transfer':'跨店调拨','DC replenishment':'配送中心补货'};return lang==='zh'?(zh[name]||name):name}
function aiChannelStatus(value){const zh={COVERED:'供货可覆盖',DRAFT_UNTIL_APPROVED:'待审批草稿',TRANSFER_PENDING_APPROVAL:'调拨待审批',REPLENISHMENT_PENDING_APPROVAL:'补货待审批',STORE_COUNT_REQUIRED:'等待门店盘点',NOT_ACTIVATED:'不启动',SUPPLY_ACTION_REQUIRED:'需要补充供货',SUPPLY_GAP:'存在供货缺口',NO_CAMPAIGN:'不发起活动'};return lang==='zh'?(zh[value]||status(value)):status(value)}
function aiAgentName(name){const zh={'Inventory Agent':'库存预测','Pricing Agent':'促销推演','Customer Understanding Agent':'客群筛选','Personalization Agent':'个性化建议','Marketing Agent':'渠道编排'};return lang==='zh'?(zh[name]||name):name}
function aiAgentOutput(d){if(lang==='en')return d.output;const zh={'Inventory Agent':'预测需求并校验可供库存与调拨能力。','Pricing Agent':'比较折扣梯度、利润回报与价格护栏。','Customer Understanding Agent':'筛选有授权且近期有品类意向的会员。','Personalization Agent':'只推荐有可售库存的商品与门店。','Marketing Agent':'生成受控会员券和渠道草稿，审批前不触达。'};return zh[d.agent]||d.output}
function renderDecisionIntelligence(c){const ai=decisionIntelligence[c.case_id];if(!ai)return `<div class="loading">${lang==='zh'?'正在生成 AI 决策推演…':'Building AI decision simulation…'}</div>`;const selected=ai.scenarios.find(s=>s.key===(aiScenario[c.case_id]||ai.brief.recommended_scenario))||ai.scenarios[0],forecast=ai.forecast,max=Math.max(...forecast.recommended.map(x=>x.p90),1),isPromo=c.case_type==='SEASONAL_OVERSTOCK';return `<div class="ai-studio"><section class="ai-brief-card"><div class="ai-brief-top"><div class="ai-orb">${icon('sparkles',19)}</div><div><div class="eyebrow" style="color:#82d8c3">${lang==='zh'?'AI 决策智能 · 只读推演':'AI DECISION INTELLIGENCE · READ-ONLY'}</div><h3>${lang==='zh'?(isPromo?'建议采用定向会员促销，并先完成渠道调拨':'先恢复供货，不建议对缺货商品做促销'):ai.brief.headline}</h3><p>${lang==='zh'?(isPromo?'AI 已比较 5 档折扣、7 天需求、渠道可供量、会员授权和毛利政策，然后给出推荐。':'AI 已比较未来 7 天需求、当前 ATP、调拨和补货能力，并阻止促销继续放大缺货。'):ai.brief.summary}</p></div></div><div class="ai-metrics"><div class="ai-metric"><span>${lang==='zh'?'7 天预测销量':'7-day forecast'}</span><strong>${fmt(ai.brief.recommended_units)} ${lang==='zh'?'件':'units'}</strong></div><div class="ai-metric"><span>${lang==='zh'?'AI 置信度':'AI confidence'}</span><strong>${Math.round(ai.brief.confidence*100)}%</strong></div><div class="ai-metric"><span>${lang==='zh'?'预计增量利润':'Incremental profit'}</span><strong>${ai.brief.recommended_incremental_profit_cny==null?'—':`¥${fmt(ai.brief.recommended_incremental_profit_cny)}`}</strong></div><div class="ai-metric"><span>${lang==='zh'?'已阻止动作':'Blocked action'}</span><strong style="font-size:11px">${lang==='zh'?(isPromo?'30% 全渠道降价':'库存紧张时促销'):ai.brief.blocked_action}</strong></div></div><div class="ai-boundary">${icon('info',11)}${lang==='zh'?'以下为基于当前 Case 快照与演示历史样本的情景预测，不是已发生销售。':esc(ai.data_boundary)}</div></section><section class="ai-section"><div class="ai-section-head"><div><h4>${lang==='zh'?'未来 7 天需求预测':'7-day demand forecast'}</h4><p>${lang==='zh'?'灰色为自然销量，绿色为推荐方案；区间表示预测不确定性。':'Grey is baseline; green is recommended. Range reflects uncertainty.'}</p></div><span class="spacer"></span><span>${Math.round(ai.forecast.confidence*100)}% ${lang==='zh'?'置信度':'confidence'}</span></div><div class="forecast-chart">${forecast.recommended.map((x,i)=>`<div class="forecast-day"><div class="forecast-bars"><span class="forecast-bar baseline" style="height:${Math.max(4,forecast.baseline[i].p50/max*100)}%" title="${forecast.baseline[i].p50}"></span><span class="forecast-bar recommended" style="height:${Math.max(4,x.p50/max*100)}%" title="${x.p50}"></span></div><small>${lang==='zh'?'第':'D'}${x.day}${lang==='zh'?'天':''}</small></div>`).join('')}</div><div class="forecast-legend"><span><i style="background:#d7ddd9"></i>${lang==='zh'?'自然销量':'Baseline'}</span><span><i style="background:#13a184"></i>${lang==='zh'?'推荐方案':'Recommended'}</span><span class="spacer"></span><span>${lang==='zh'?'方法：POS 速率 + 历史相似促销验证':'Method: POS rate + comparable promotion validation'}</span></div></section><section class="ai-section"><div class="ai-section-head"><div><h4>${lang==='zh'?'AI 比较了哪些方案':'Options compared by AI'}</h4><p>${lang==='zh'?'点击方案即可查看对应预测；选择不会写入生产系统。':'Select an option to inspect its forecast; selection never writes production systems.'}</p></div></div><div class="scenario-cards">${ai.scenarios.map(s=>`<button class="scenario-card ${selected.key===s.key?'selected':''} ${s.status==='POLICY_BLOCKED'?'blocked':''}" onclick="setAiScenario('${c.case_id}','${s.key}')"><span class="badge ${s.status==='RECOMMENDED'?'completed':s.status==='POLICY_BLOCKED'?'critical':'neutral'}">${aiScenarioStatus(s)}</span><h5>${aiScenarioName(s)}</h5><p>${aiScenarioReason(s)}</p><div class="scenario-metrics"><span>${lang==='zh'?'预测销量':'Forecast'}<strong>${fmt(s.predicted_units)}</strong></span><span>${lang==='zh'?'期末 ATP':'Ending ATP'}<strong>${fmt(s.ending_atp)}</strong></span><span>${isPromo?(lang==='zh'?'利润 ROI':'Profit ROI'):(lang==='zh'?'供货动作':'Supply action')}<strong>${s.profit_roi==null?fmt(s.transfer_qty):`${fmt(s.profit_roi,2)}×`}</strong></span></div></button>`).join('')}</div><div class="operation-result">${lang==='zh'?`当前查看：${aiScenarioName(selected)}。${aiScenarioReason(selected)}`:`Viewing ${aiScenarioName(selected)}. ${aiScenarioReason(selected)}`}</div></section><section class="ai-section"><div class="ai-section-head"><div><h4>${lang==='zh'?'供货处置与销售限制':'Supply actions and selling limits'}</h4><p>${lang==='zh'?'先恢复可售库存；在到货前限制会放大缺货的销售动作。':'Restore sellable supply before any demand-generating action.'}</p></div></div><div class="channel-plan">${ai.channel_supply_plan.map(ch=>{const scale=Math.max(ch.forecast_units,ch.supply_cap,1);return `<div class="channel-row"><div><h5>${aiChannelName(ch.channel)}</h5><p>${esc(ch.purpose)}</p></div><div><div class="supply-bar"><span style="width:${Math.min(100,ch.supply_cap/scale*100)}%"></span></div><p class="sub" style="margin-top:5px">${lang==='zh'?'预测需求':'Forecast'} ${fmt(ch.forecast_units)} · ${lang==='zh'?'供货上限':'Supply cap'} ${fmt(ch.supply_cap)}</p></div><div class="channel-value"><strong>${aiChannelStatus(ch.status)}</strong></div></div>`}).join('')}</div></section><section class="ai-section"><div class="ai-section-head"><div><h4>${lang==='zh'?'审批前检查':'Pre-approval checks'}</h4><p>${lang==='zh'?'只展示会影响业务决策的限制条件。':'Only decision-relevant constraints are shown here.'}</p></div></div><div class="agent-pipeline">${ai.agent_trace.map(d=>`<div class="agent-step"><span>${Math.round(d.confidence*100)}% ${lang==='zh'?'置信':'confidence'}</span><h5>${aiAgentName(d.agent)}</h5><p>${aiAgentOutput(d)}</p></div>`).join('')}</div></section><section class="ai-section"><div class="ai-section-head"><div><h4>${lang==='zh'?'护栏与学习闭环':'Guardrails & learning loop'}</h4><p>${lang==='zh'?'审批后比较预测与实际，让下一次促销和供货决策更准确。':'Compare forecast with actual outcomes after approval to improve the next decision.'}</p></div></div><div class="guardrail-list">${ai.guardrails.map(g=>`<div class="guardrail ${g.status==='BLOCK'?'block':''}"><strong>${esc(g.name)} · ${status(g.status)}</strong>${esc(g.detail)}</div>`).join('')}</div><div class="operation-result">${lang==='zh'?`监控节点：24 小时触达响应 → 7 天售罄与缺货 → 14 天增量利润；采用 ${esc(ai.learning_plan.measurement)}。`:`Checkpoints: ${ai.learning_plan.checkpoints.join(' → ')} using ${ai.learning_plan.measurement}.`}</div></section></div>`}
function businessActionSummary(c){const names={TRANSFER:lang==='zh'?'门店间调拨':'Store transfer',REPLENISH:lang==='zh'?'仓库补货':'DC replenishment',STORE_CYCLE_COUNT:lang==='zh'?'门店盘点':'Store count',COUPON:lang==='zh'?'会员券':'Member offer',VOUCHER:lang==='zh'?'15% 会员券草稿':'15% member offer draft',MARKDOWN:lang==='zh'?'全渠道降价':'Broad markdown'};return c.actions.map(a=>{const key=Object.keys(names).find(k=>a.action_type.includes(k));if(!key)return '';const qty=a.quantity?` ${fmt(a.quantity)} ${lang==='zh'?'件':'units'}`:'';return `<div><strong>${names[key]}${qty}</strong><br><span class="sub">${status(a.status)}${a.status==='BLOCKED'?(lang==='zh'?'，不会执行':', will not execute'):''}</span></div>`}).join('')}
function auditDetails(c){const p=c.decision_packet;return `<details class="audit-disclosure"><summary>${lang==='zh'?'审计与规则信息':'Audit & policy details'}</summary><p>${esc(p.packet_id)} · ${esc(p.policy_version)}<br>${c.case_id} · ${lang==='zh'?'到期':'Expires'} ${time(p.expires_at)}</p></details>`}
function renderRoleActionPanel(c){if(userRole==='store')return renderStoreActionPanel(c);if(userRole==='regional')return renderRegionalActionPanel(c);return renderExecutiveActionPanel(c)}
function renderStoreActionPanel(c){const a=c.actions.find(x=>x.owner_role==='Store Manager');let title=lang==='zh'?'当前无需门店操作':'No store action needed',body=lang==='zh'?'后续事项由区域团队处理，你可以查看处理记录。':'The regional team owns the next step. You can view the activity log.',controls=`<button onclick="setDetailTab('execution')">${lang==='zh'?'查看处理记录':'View activity'}</button>`,result='';if(a?.status==='WAITING_FOR_STORE_ACCEPTANCE'){title=lang==='zh'?'接受盘点任务':'Accept stock count';body=lang==='zh'?'请确认你能在时限内完成盘点。':'Confirm you can complete the count within the deadline.';controls=`<button class="primary" onclick="acceptAction('${c.case_id}','${a.action_id}')">${icon('check')}${lang==='zh'?'接受并开始':'Accept and start'}</button><button onclick="rejectAction('${c.case_id}','${a.action_id}')">${lang==='zh'?'无法按时完成':'Cannot complete in time'}</button>`;result=lang==='zh'?'接受后即可填写实盘数量。':'After accepting, enter the physical count.'}else if(a?.status==='READY'){title=lang==='zh'?'填写实盘数量':'Enter physical count';body=lang==='zh'?'填写货架、仓库、待退货和隔离区的实物总数。':'Enter the total across sales floor, stockroom, returns, and quarantine.';controls=`<label class="sub" for="count-${a.action_id}">${lang==='zh'?'实际盘点数量（件）':'Physical count (units)'}</label><input class="count-input" id="count-${a.action_id}" type="number" value="58"><button class="primary" onclick="executeAction('${c.case_id}','${a.action_id}',true)">${icon('send')}${lang==='zh'?'提交盘点结果':'Submit count'}</button>`;result=lang==='zh'?'提交后，库存会更新并自动发送给区域经理。':'Submission updates stock and routes the case to the regional manager.'}else if(a?.status==='COMPLETED'){title=lang==='zh'?'盘点已提交':'Count submitted';body=lang==='zh'?'区域经理将根据更新后的库存处理调拨或补货。':'The regional manager will decide transfers or replenishment using the updated stock.'}return `<aside class="human-panel"><div class="eyebrow">${lang==='zh'?'我的任务':'MY TASK'}</div><p class="action-question">${title}</p><p>${body}</p><div class="human-actions">${controls}</div>${result?`<div class="operation-result">${result}</div>`:''}${auditDetails(c)}</aside>`}
function renderRegionalActionPanel(c){const allowed=c.decision_packet.required_approval_roles.includes('Regional Operations Manager');let title=lang==='zh'?'当前无需区域审批':'No regional approval needed',body=lang==='zh'?`当前由${roleName(c.owner_role)}处理，你只需关注进度。`:`Currently owned by ${roleName(c.owner_role)}; monitor progress only.`,controls=`<button onclick="setDetailTab('execution')">${lang==='zh'?'查看进度':'View progress'}</button>`;if(c.status==='WAITING_FOR_APPROVAL'&&allowed){title=regionalQuestion(c);body=businessRecommendation(c);controls=`<button onclick="rejectCase('${c.case_id}','Regional Operations Manager')">${lang==='zh'?'退回修改':'Return for revision'}</button><button class="primary" onclick="approveCase('${c.case_id}','Regional Operations Manager')">${icon('check')}${lang==='zh'?'批准并执行':'Approve and execute'}</button>`}else if(c.status==='COMPLETED'){title=lang==='zh'?'区域事项已完成':'Regional action completed';body=lang==='zh'?'可以查看执行回执并进入效果复盘。':'Review execution receipts and business outcomes.'}return `<aside class="human-panel"><div class="eyebrow">${lang==='zh'?'区域经理决策':'REGIONAL DECISION'}</div><p class="action-question">${title}</p><p>${body}</p>${allowed?`<div class="action-summary">${businessActionSummary(c)}</div>`:''}<div class="human-actions">${controls}</div>${allowed&&c.status==='WAITING_FOR_APPROVAL'?`<div class="operation-result">${lang==='zh'?'批准后，系统只执行上方列出的动作，并保留每一步回执。':'Only the listed actions will execute; each step retains a receipt.'}</div>`:''}${auditDetails(c)}</aside>`}
function renderExecutiveActionPanel(c){const allowed=c.decision_packet.required_approval_roles.some(r=>['Merchandise Manager','International Business Executive'].includes(r));let title=lang==='zh'?'无需管理层操作':'No executive action needed',body=lang==='zh'?'该事项属于门店或区域日常运营，不需要越级审批。':'This is routine store or regional operations and does not require escalation.',controls=`<button onclick="setDetailTab('execution')">${lang==='zh'?'查看进度':'View progress'}</button>`;if(c.status==='WAITING_FOR_APPROVAL'&&allowed){title=lang==='zh'?'是否批准当前经营方案？':'Approve this business plan?';body=businessRecommendation(c);controls=`<button onclick="rejectCase('${c.case_id}','Merchandise Manager')">${lang==='zh'?'退回国家团队':'Return to country team'}</button><button class="primary" onclick="approveCase('${c.case_id}','Merchandise Manager')">${icon('check')}${lang==='zh'?'批准经营方案':'Approve business plan'}</button>`}else if(allowed&&c.status==='COMPLETED'){title=lang==='zh'?'经营方案已完成':'Business plan completed';body=lang==='zh'?'查看促销与库存动作的执行结果，并安排经营复盘。':'Review promotion and inventory execution, then schedule the business review.'}return `<aside class="human-panel"><div class="eyebrow">${lang==='zh'?'重大经营决策':'STRATEGIC BUSINESS DECISION'}</div><p class="action-question">${title}</p><p>${body}</p>${allowed?`<div class="action-summary">${businessActionSummary(c)}</div>`:''}<div class="human-actions">${controls}</div>${allowed?`<div class="operation-result">${lang==='zh'?'30% 全渠道降价已被毛利底线阻止；本次批准不会解除该限制。':'The 30% broad markdown is blocked by the margin floor; this approval does not override it.'}</div>`:''}${auditDetails(c)}</aside>`}
function renderPacket(c){const p=c.decision_packet;return `<div class="packet"><div class="packet-top"><h4>${t('decisionPacket')}</h4><span class="packet-id">${p.packet_id} · v${p.version}</span>${badge(p.status)}</div><div class="packet-rec">${esc(localText(p.recommendation))}</div><div class="packet-columns"><div><strong>${t('rationale')}</strong><ul>${textList(p.rationale).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><strong>${t('alternatives')}</strong><ul>${textList(p.alternatives).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><strong>${t('blockers')}</strong>${p.blockers.length?`<ul>${textList(p.blockers).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p class="sub">${lang==='zh'?'无':'None'}</p>`}<div class="attention">${lang==='zh'?'决策包到期':'Packet expires'} ${time(p.expires_at)}. ${lang==='zh'?'所需角色':'Required role'}: ${esc(p.required_approval_roles.map(roleName).join(', ')||(lang==='zh'?'无':'None'))}.</div></div></div>${c.status==='WAITING_FOR_APPROVAL'?`<div class="packet-actions"><button class="danger" onclick="rejectCase('${c.case_id}')">${icon('x')}${t('reject')}</button><button class="primary" onclick="approveCase('${c.case_id}','${esc(p.required_approval_roles[0]||c.owner_role)}')">${icon('check')}${t('approve')}</button></div>`:''}</div>`}
function renderAction(c,a){let controls='';if(a.status==='WAITING_FOR_STORE_ACCEPTANCE')controls=`<button class="small danger" onclick="rejectAction('${c.case_id}','${a.action_id}')">${t('rejectTask')}</button><button class="small primary" onclick="acceptAction('${c.case_id}','${a.action_id}')">${t('accept')}</button>`;if(a.status==='READY'&&a.action_type==='STORE_CYCLE_COUNT')controls=`<input class="count-input" id="count-${a.action_id}" type="number" value="58" aria-label="${t('observed')}"><button class="small primary" onclick="executeAction('${c.case_id}','${a.action_id}',true)">${icon('scan-line',14)}${t('execute')}</button>`;if(a.status==='APPROVED')controls=`<button class="small primary" onclick="executeAction('${c.case_id}','${a.action_id}')">${icon('play',14)}${t('execute')}</button>`;if(a.status==='FAILED')controls=`<button class="small primary" onclick="executeAction('${c.case_id}','${a.action_id}')">${icon('refresh-cw',14)}${t('retry')}</button>`;return `<div class="action-row"><div><div class="row-title">${esc(localText(a.title))} ${badge(a.status)}</div><div class="action-meta"><span>${t('target')}: ${esc(localText(a.target_system))}</span><span>${t('owner')}: ${esc(roleName(a.owner_role))}</span><span>${lang==='zh'?'截止':'Due'}: ${time(a.due_at)}</span><span class="mono">${esc(a.idempotency_key)}</span></div>${a.rejection_reason?`<div class="blocked-note">${esc(localText(a.rejection_reason))}</div>`:''}</div><div class="action-controls">${controls}</div></div>`}
function renderApproval(){if(userRole==='store'){const list=cases.filter(c=>c.actions.some(a=>a.owner_role==='Store Manager'&&a.status==='COMPLETED'));return pageHead(lang==='zh'?'已提交给区域团队':'Submitted to regional team',lang==='zh'?'门店提交后无需继续审批，可在这里查看流转状态。':'No further store approval is needed after submission.')+`<div class="view-list">${list.length?list.map(c=>renderStoreTask(c,true)).join(''):`<div class="panel empty">${lang==='zh'?'尚无已提交事项':'Nothing submitted yet'}</div>`}</div>`}const executive=userRole==='executive',role=executive?'Merchandise Manager':'Regional Operations Manager',list=cases.filter(c=>c.status==='WAITING_FOR_APPROVAL'&&c.decision_packet.required_approval_roles.includes(role));const title=executive?(lang==='zh'?'重大经营决策':'Strategic business decisions'):(lang==='zh'?'待我审批':'My approvals'),sub=executive?(lang==='zh'?'促销、价格与跨市场资源配置方案':'Promotion, pricing, and cross-market resource plans'):(lang==='zh'?'只显示区域经理有权批准的调拨和补货方案':'Only transfer and replenishment plans within regional authority');return pageHead(title,sub,`<button onclick="loadCases()">${icon('refresh-cw')}${t('refresh')}</button>`)+`<div class="role-list">${list.length?list.map(c=>executive?renderExecutiveTask(c,true):renderRegionalTask(c,true)).join(''):`<section class="role-empty">${icon('circle-check-big',28)}<h3>${lang==='zh'?'当前没有待审批事项':'No approvals waiting'}</h3></section>`}</div>`}
function renderExecution(){const rows=cases.flatMap(c=>c.actions.map(a=>({c,a}))).filter(x=>['APPROVED','READY','FAILED','COMPLETED'].includes(x.a.status));const receipts=cases.flatMap(c=>c.execution_receipts.map(r=>({c,r})));return pageHead(t('executionTitle'),t('executionSub'),`<button onclick="loadCases()">${icon('refresh-cw')}${t('refresh')}</button>`)+`<section class="panel"><div class="panel-title"><h3>${t('actions')}</h3><span class="meta">${rows.length}</span></div><div class="detail-section action-list">${rows.length?rows.map(({c,a})=>renderAction(c,a)).join(''):`<div class="empty">${t('noItems')}</div>`}</div></section><section class="panel case-detail"><div class="panel-title"><h3>${t('executionReceipts')}</h3><span class="meta">${receipts.length}</span></div><div class="detail-section receipt-list">${receipts.length?receipts.sort((a,b)=>b.r.completed_at.localeCompare(a.r.completed_at)).map(({c,r})=>`<div class="receipt-row"><span>${r.status==='COMPLETED'?icon('check-circle',17):icon('alert-circle',17)}</span><div><div class="row-title">${esc(r.action_id)} · ${esc(localText(r.target_system))}</div><p>${esc(localText(r.detail))}${r.compensation_action?` ${lang==='zh'?'补偿':'Compensation'}: ${esc(localText(r.compensation_action))}`:''}</p><span class="sub">${c.case_id} · ${t('attempt')} ${r.attempt} · ${time(r.completed_at)}</span></div>${badge(r.status)}</div>`).join(''):`<div class="empty">${t('noItems')}</div>`}</div></section>`}
function renderAudit(){const audits=cases.flatMap(c=>c.audit_log.map(a=>({c,a}))).sort((a,b)=>b.a.time.localeCompare(a.a.time));const totalActions=cases.reduce((n,c)=>n+c.actions.length,0),blocked=cases.reduce((n,c)=>n+c.actions.filter(a=>a.status==='BLOCKED').length,0),stale=cases.filter(c=>c.kpi_observations.stale_data_blocked).length,receipts=cases.reduce((n,c)=>n+c.execution_receipts.length,0);return pageHead(t('auditTitle'),t('auditSub'))+`<section class="kpi-grid"><div class="kpi"><span>${lang==='zh'?'决策包周期':'Decision packet cycle time'}</span><strong>7-11 min</strong><small>${t('demoObserved')}</small></div><div class="kpi"><span>${lang==='zh'?'陈旧/低可信阻断':'Stale/low-confidence blocks'}</span><strong>${stale}</strong><small>${t('demoObserved')}</small></div><div class="kpi"><span>${lang==='zh'?'策略阻断动作':'Policy-blocked actions'}</span><strong>${blocked}/${totalActions}</strong><small>${t('demoObserved')}</small></div><div class="kpi"><span>${lang==='zh'?'执行回执':'Execution receipts'}</span><strong>${receipts}</strong><small>${t('demoObserved')}</small></div><div class="kpi"><span>${lang==='zh'?'同店销售提升':'Same-store sales uplift'}</span><strong>${lang==='zh'?'未测量':'Not measured'}</strong><small>${lang==='zh'?'需要 test/control 试点':'Requires test/control pilot'}</small></div><div class="kpi"><span>${lang==='zh'?'LTV 提升':'LTV uplift'}</span><strong>${lang==='zh'?'未测量':'Not measured'}</strong><small>${lang==='zh'?'需要长期队列验证':'Requires longitudinal cohort'}</small></div></section><section class="panel case-detail"><div class="panel-title"><h3>${lang==='zh'?'不可变决策历史':'Immutable decision history'}</h3><span class="meta">${audits.length} ${lang==='zh'?'条事件':'events'}</span></div><div class="detail-section audit-list">${audits.map(({c,a})=>`<div class="audit-row"><span>${icon('history',16)}</span><div><div class="row-title">${esc(localText(a.action))}</div><p>${esc(localText(a.detail))}</p><span class="sub">${c.case_id} · ${esc(localText(a.actor))} · ${time(a.time)}</span></div></div>`).join('')}</div></section>`}

function zhGuardrailName(g){const names={'Inventory availability':'库存可供性','Member consent':'会员触达授权','Margin policy':'毛利底线','Production write':'执行权限'};return lang==='zh'?(names[g.name]||g.name):g.name}
function zhGuardrailDetail(g){const detail={'Recommended demand and transfer fit within sellable ATP.':'推荐方案未超过当前可售库存和可调拨能力。','Only consented members with recent category intent are eligible.':'会员触达仅限已授权且近期有相关品类意向的人群。','The 30% chain-wide markdown remains blocked.':'全渠道 30% 降价不符合当前毛利底线，继续阻止。','The simulation cannot write WMS, CRM, or pricing systems.':'审批通过前，不会写入库存、会员、价格或门店任务系统。','Promotion remains disabled until supply is restored.':'供货恢复前不启动促销，避免放大缺货。','Transfer and replenishment require the authorized role.':'调拨和补货需要对应负责人审批。'};return lang==='zh'?(detail[g.detail]||g.detail):g.detail}
function decisionChannelTitle(isPromo){return lang==='zh'?(isPromo?'渠道与库存约束':'供货处置与销售限制'):(isPromo?'Channel and inventory constraints':'Supply actions and selling limits')}
function decisionChannelSub(isPromo){return lang==='zh'?(isPromo?'先确认每个触达渠道可承接的库存，再决定是否发券或降价。':'先恢复可售库存；在到货前限制会放大缺货的销售动作。'):(isPromo?'Confirm available supply before vouchers or markdowns.':'Restore sellable supply before any demand-generating action.')}

function channelMetricLabel(isPromo){return lang==='zh'?(isPromo?'预测销量 / 可承接库存':'预计需求 / 可用供货'):(isPromo?'Forecast / supply cap':'Demand / available supply')}

function renderDecisionIntelligence(c){const ai=decisionIntelligence[c.case_id];if(!ai)return `<div class="loading">${lang==='zh'?'正在生成经营推演...':'Building decision support...'}</div>`;const selected=ai.scenarios.find(s=>s.key===(aiScenario[c.case_id]||ai.brief.recommended_scenario))||ai.scenarios[0],forecast=ai.forecast,max=Math.max(...forecast.recommended.map(x=>x.p90),1),isPromo=c.case_type==='SEASONAL_OVERSTOCK';return `<div class="ai-studio"><section class="ai-brief-card"><div class="ai-brief-top"><div class="ai-orb">${icon('sparkles',19)}</div><div><div class="eyebrow" style="color:#82d8c3">${lang==='zh'?'经营决策助手 · 只读推演':'DECISION SUPPORT · READ-ONLY'}</div><h3>${lang==='zh'?(isPromo?'建议先调拨库存，再做小范围会员券':'先恢复供货，暂不扩大促销'):ai.brief.headline}</h3><p>${lang==='zh'?(isPromo?'系统根据 7 天需求、可售库存、毛利底线和会员授权，给出可审批的调拨与促销组合。':'当前可售库存无法覆盖预计需求，应先处理调拨和补货，到货前不做主动促销。'):ai.brief.summary}</p></div></div><div class="ai-metrics"><div class="ai-metric"><span>${lang==='zh'?'7 天预计需求':'7-day demand'}</span><strong>${fmt(ai.brief.recommended_units)} ${lang==='zh'?'件':'units'}</strong></div><div class="ai-metric"><span>${lang==='zh'?'库存可信度':'Inventory confidence'}</span><strong>${Math.round(c.inventory.inventory_confidence*100)}%</strong></div><div class="ai-metric"><span>${lang==='zh'?'预计增量利润':'Incremental profit'}</span><strong>${ai.brief.recommended_incremental_profit_cny==null?'—':`¥${fmt(ai.brief.recommended_incremental_profit_cny)}`}</strong></div><div class="ai-metric"><span>${lang==='zh'?'当前限制':'Current limit'}</span><strong style="font-size:11px">${lang==='zh'?(isPromo?'大范围深折扣':'缺货商品促销'):ai.brief.blocked_action}</strong></div></div><div class="ai-boundary">${icon('info',11)}${lang==='zh'?'以下是基于当前 Case 快照的经营预测，不代表已发生销售。':esc(ai.data_boundary)}</div></section><section class="ai-section"><div class="ai-section-head"><div><h4>${lang==='zh'?'未来 7 天需求预测':'7-day demand forecast'}</h4><p>${lang==='zh'?'灰色为自然销量，绿色为当前推荐方案；区间表示不确定性。':'Grey is baseline; green is the recommended option. Range reflects uncertainty.'}</p></div></div><div class="forecast-chart">${forecast.recommended.map((x,i)=>`<div class="forecast-day"><div class="forecast-bars"><span class="forecast-bar baseline" style="height:${Math.max(4,forecast.baseline[i].p50/max*100)}%" title="${forecast.baseline[i].p50}"></span><span class="forecast-bar recommended" style="height:${Math.max(4,x.p50/max*100)}%" title="${x.p50}"></span></div><small>${lang==='zh'?'第':'D'}${x.day}${lang==='zh'?'天':''}</small></div>`).join('')}</div><div class="forecast-legend"><span><i style="background:#d7ddd9"></i>${lang==='zh'?'自然销量':'Baseline'}</span><span><i style="background:#13a184"></i>${lang==='zh'?'推荐方案':'Recommended'}</span><span class="spacer"></span><span>${lang==='zh'?'口径：POS 销售速率 + 历史相似活动校验':'Method: POS rate + comparable promotion validation'}</span></div></section><section class="ai-section"><div class="ai-section-head"><div><h4>${lang==='zh'?'可选经营方案':'Business options'}</h4><p>${lang==='zh'?'点击查看不同方案的库存和收益影响；这里不会写入生产系统。':'Select an option to inspect supply and margin impact; this does not write production systems.'}</p></div></div><div class="scenario-cards">${ai.scenarios.map(s=>`<button class="scenario-card ${selected.key===s.key?'selected':''} ${s.status==='POLICY_BLOCKED'?'blocked':''}" onclick="setAiScenario('${c.case_id}','${s.key}')"><span class="badge ${s.status==='RECOMMENDED'?'completed':s.status==='POLICY_BLOCKED'?'critical':'neutral'}">${aiScenarioStatus(s)}</span><h5>${aiScenarioName(s)}</h5><p>${aiScenarioReason(s)}</p><div class="scenario-metrics"><span>${lang==='zh'?'预测销量':'Forecast'}<strong>${fmt(s.predicted_units)}</strong></span><span>${lang==='zh'?'期末可售':'Ending ATP'}<strong>${fmt(s.ending_atp)}</strong></span><span>${isPromo?(lang==='zh'?'利润 ROI':'Profit ROI'):(lang==='zh'?'调补数量':'Supply qty')}<strong>${s.profit_roi==null?fmt(s.transfer_qty):`${fmt(s.profit_roi,2)}×`}</strong></span></div></button>`).join('')}</div><div class="operation-result">${lang==='zh'?`当前查看：${aiScenarioName(selected)}。${aiScenarioReason(selected)}`:`Viewing ${aiScenarioName(selected)}. ${aiScenarioReason(selected)}`}</div></section><section class="ai-section"><div class="ai-section-head"><div><h4>${decisionChannelTitle(isPromo)}</h4><p>${decisionChannelSub(isPromo)}</p></div></div><div class="channel-plan">${ai.channel_supply_plan.map(ch=>{const scale=Math.max(ch.forecast_units,ch.supply_cap,1);return `<div class="channel-row"><div><h5>${aiChannelName(ch.channel)}</h5><p>${esc(channelPurpose(ch))}</p></div><div><div class="supply-bar"><span style="width:${Math.min(100,ch.supply_cap/scale*100)}%"></span></div><p class="sub" style="margin-top:5px">${channelMetricLine(ch,isPromo)}</p></div><div class="channel-value"><strong>${aiChannelStatus(ch.status)}</strong></div></div>`}).join('')}</div></section><section class="ai-section"><div class="ai-section-head"><div><h4>${lang==='zh'?'审批前检查':'Pre-approval checks'}</h4><p>${lang==='zh'?'系统只展示会影响业务决策的限制条件。':'Only decision-relevant constraints are shown here.'}</p></div></div><div class="guardrail-list">${ai.guardrails.map(g=>`<div class="guardrail ${g.status==='BLOCK'?'block':''}"><strong>${esc(zhGuardrailName(g))} · ${status(g.status)}</strong>${esc(zhGuardrailDetail(g))}</div>`).join('')}</div><div class="operation-result">${lang==='zh'?`复盘口径：审批后跟踪到货、售罄、缺货和增量利润。`:`Review after approval: supply receipt, sell-through, stockout and incremental profit.`}</div></section></div>`}

function renderPanelStory(active,complete,confidence){const human=cases.filter(c=>['WAITING_FOR_APPROVAL','WAITING_FOR_STORE_CONFIRMATION','PARTIALLY_EXECUTED'].includes(c.status)).length,blocked=cases.reduce((n,c)=>n+c.actions.filter(a=>a.status==='BLOCKED').length,0),receipts=cases.reduce((n,c)=>n+c.execution_receipts.length,0);const stage=active?stageIndex(active):5;const storySteps=lang==='zh'?[['业务异常','天气、销售、库存和门店信号形成一个经营 Case。'],['可信事实','ATP、毛利、会员授权和库存可信度统一口径。'],['经营方案','系统给出可审批的补货、调拨、促销或限制建议。'],['人工决策','店长、区域经理和经营管理层按权限审批。'],['受控执行','审批后写入下游系统，并记录回执与复盘指标。']]:[['Exception','Weather, sales, inventory and store signals form one operating Case.'],['Truth','ATP, margin, consent and confidence share one definition.'],['Plan','The system proposes approvable supply, transfer, promotion or restriction actions.'],['Decision','Store, regional and executive roles approve by authority.'],['Execution','Approved actions write downstream with receipts and outcome review.']];return `<section class="panel-story"><div class="story-hero"><div class="eyebrow">${lang==='zh'?'AMA 二次过堂演示故事':'AMA PANEL STORY MODE'}</div><h2>${lang==='zh'?'从“技术演示”切回真实零售经营流程':'A retail workflow, not an internal technology demo'}</h2><p>${lang==='zh'?'系统把商品、库存、会员和门店履约信号收敛成一个经营 Case。区域经理看到的是业务问题、建议方案、限制条件和审批动作，而不是内部能力如何编排。':'The system turns product, inventory, member and fulfillment signals into one operating Case. A regional manager sees the issue, plan, constraints and approval action, not internal orchestration.'}</p><div class="story-actions">${active?`<button class="primary" onclick="openCase('${active.case_id}')">${icon('play-circle')}${lang==='zh'?'开始系统演示':'Start demo'}</button>`:''}<button onclick="startTour()">${icon('route')}${lang==='zh'?'业务流程':'Workflow'}</button><button onclick="setView('audit')">${icon('history')}${lang==='zh'?'查看审计证据':'Audit proof'}</button></div><div class="story-points"><div class="story-point"><span>${lang==='zh'?'业务主线':'Business fit'}</span><strong>${lang==='zh'?'客户数据与全渠道动作受库存和授权约束':'Customer and channel actions constrained by supply and consent'}</strong></div><div class="story-point"><span>${lang==='zh'?'可信升级':'Credibility'}</span><strong>${lang==='zh'?'每个动作都有审批、执行和回执':'Every action has approval, execution and receipt'}</strong></div><div class="story-point"><span>${lang==='zh'?'证据边界':'Evidence boundary'}</span><strong>${lang==='zh'?'演示展示流程，效果需试点验证':'Demo shows workflow; uplift needs pilot validation'}</strong></div></div></div><aside class="story-proof"><h3>${lang==='zh'?'现场应展示的证据':'Proof to show'}</h3><div class="proof-row"><span>${icon('database',16)}</span><div><b>${lang==='zh'?'客户与经营信号':'Customer + retail signals'}</b><small>${lang==='zh'?'线上、移动端、门店、会员和库存进入同一 Case':'Online, mobile, store, member and inventory data enter one Case'}</small></div><strong>${cases.length}</strong></div><div class="proof-row"><span>${icon('shield-check',16)}</span><div><b>${lang==='zh'?'业务护栏':'Business guardrails'}</b><small>${lang==='zh'?'库存、毛利、授权和角色权限可阻断动作':'Supply, margin, consent and authority can block actions'}</small></div><strong>${blocked}</strong></div><div class="proof-row"><span>${icon('stamp',16)}</span><div><b>${lang==='zh'?'人工审批':'Human approval'}</b><small>${lang==='zh'?'高风险补货、价格和触达动作审批后执行':'Risky supply, price and outreach actions execute after approval'}</small></div><strong>${human}</strong></div><div class="proof-row"><span>${icon('receipt',16)}</span><div><b>${lang==='zh'?'执行回执':'Execution receipts'}</b><small>${lang==='zh'?'幂等、重试、补偿路径可追踪':'Idempotency, retry and compensation are visible'}</small></div><strong>${receipts}</strong></div></aside></section>${renderRequirementMap()}<section class="story-map">${storySteps.map((s,i)=>`<article class="story-map-step ${i+1===stage?'current':''}"><div class="num">${i+1}</div><strong>${s[0]}</strong><p>${s[1]}</p></article>`).join('')}</section>`}

2>${lang==='zh'?'按优先级处理':'Work by priority'}</h2><p>${lang==='zh'?'每张卡只呈现业务影响和下一步。':'Each card shows business impact and the next action.'}</p></div><button onclick="resetCases()">${icon('rotate-ccw')}${t('reset')}</button></div><section class="task-grid">${cases.map(c=>`<button class="task-card" onclick="openCase('${c.case_id}')"><div class="task-card-top">${badge(c.severity,c.severity)}${badge(c.status)}<span class="spacer"></span><span class="eyebrow">${stageLabel(c)}</span></div><h3>${esc(caseTitle(c))}</h3><p>${esc(storeName(c))} · ${esc(productName(c.variant))} · ATP ${fmt(c.inventory.sellable_atp)}</p><div class="task-next"><strong>${lang==='zh'?'下一步':'Next action'}</strong>${esc(nextActionText(c))}</div><div class="task-meta"><span>${esc(roleName(c.owner_role))}</span><span>${timeLeft(c.sla_due_at)}</span></div></button>`).join('')}</section><div class="task-section-head"><div><h2>${lang==='zh'?'需要理解系统时':'When you need context'}</h2><p>${lang==='zh'?'按业务对象查看商品、证据、规则与计划场景。':'Explore products, evidence, rules and planning scenarios.'}</p></div></div><section class="capability-grid"><article class="capability" onclick="setView('portfolio')" style="cursor:pointer"><div class="capability-head"><span class="agent-role">${icon('shirt',15)}</span><div><h3>${lang==='zh'?'商品与 SKU':'Products & SKU'}</h3><p>${lang==='zh'?'生产 Case 与季节计划的边界':'Case facts vs seasonal planning'}</p></div></div></article><article class="capability" onclick="setView('signals')" style="cursor:pointer"><div class="capability-head"><span class="agent-role">${icon('radio-tower',15)}</span><div><h3>${lang==='zh'?'证据与可信度':'Evidence & confidence'}</h3><p>${lang==='zh'?'哪些数据真正参与了决策':'Which data entered the decision'}</p></div></div></article><article class="capability" onclick="setView('agents')" style="cursor:pointer"><div class="capability-head"><span class="agent-role">${icon('shield-check',15)}</span><div><h3>${lang==='zh'?'业务规则':'Business rules'}</h3><p>${lang==='zh'?'库存、毛利、授权和审批限制':'Supply, margin, consent and approval limits'}</p></div></div></article><article class="capability" onclick="setView('scenario')" style="cursor:pointer"><div class="capability-head"><span class="agent-role">${icon('flask-conical',15)}</span><div><h3>${lang==='zh'?'四季只读沙盘':'Read-only scenario lab'}</h3><p>${lang==='zh'?'探索风险，不直接写生产系统':'Explore risk without production writes'}</p></div></div></article></section>`}

function renderScenario(){const seasonNames={zh:{spring:'春季',summer:'夏季',autumn:'秋季',winter:'冬季'},en:{spring:'Spring',summer:'Summer',autumn:'Autumn',winter:'Winter'}}[lang];const buttons=['spring','summer','autumn','winter'].map(s=>`<button class="${s===scenarioSeason?'active':''}" onclick="loadScenario('${s}')">${seasonNames[s]}</button>`).join('');if(!scenario)return pageHead(lang==='zh'?'四季经营沙盘':'Seasonal scenario lab',lang==='zh'?'正在加载只读计划场景':'Loading read-only planning scenario')+`<div class="season-switch">${buttons}</div><div class="loading">${lang==='zh'?'正在加载':'Loading'} ${esc(seasonNames[scenarioSeason])}...</div>`;const tr=scenario.trigger||{},products=scenario.products||[];const productRows=products.map(p=>`<tr><td><strong>${esc(localText(p.name))}</strong><span class="sub mono">${esc(p.sku_id)}</span></td><td>${esc(localText(p.lifecycle))}</td><td>${fmt(p.current_stock)} / ${fmt(p.safety_stock)}</td><td>${fmt(p.baseline_daily_sales)}</td><td>${fmt(p.app_views_24h)}</td></tr>`).join('');return pageHead(lang==='zh'?'四季经营沙盘':'Seasonal scenario lab',lang==='zh'?'用于查看季节计划信号；只有形成真实 Case 后才进入审批和执行。':'Review seasonal planning signals; only real Cases enter approval and execution.',`<a class="link-button" href="/legacy" target="_blank" rel="noopener">${icon('external-link',14)}${lang==='zh'?'技术深潜':'Technical deep dive'}</a>`)+`<div class="integration-note"><strong>${lang==='zh'?'只读沙盘：':'Read-only sandbox: '}</strong>${lang==='zh'?'这里只帮助发现可能的经营异常，不直接发起补货、促销或会员触达。':'This view helps discover possible exceptions; it does not trigger replenishment, promotion or member outreach.'}</div><div class="season-switch">${buttons}</div><section class="scenario-grid"><div class="scenario-event"><span class="badge ${tr.severity==='high'?'critical':'high'}">${esc(localText(tr.type||seasonNames[scenarioSeason]))}</span><h3>${esc(localText(scenario.scenario_name))}</h3><p>${esc(localText(scenario.description))}</p><div class="metric-row"><div><span>${lang==='zh'?'气温':'Temperature
